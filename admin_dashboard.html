<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Contrôle Bizi</title>
    <style>
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2ea043;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stat-box h3 {
            font-size: 0.8rem;
            color: #8b949e;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }
        .stat-box .number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2ea043;
        }
        .table-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            overflow-x: auto;
        }
        h2 {
            font-size: 0.95rem;
            color: #c9d1d9;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #30363d;
            font-size: 0.85rem;
        }
        th {
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .badge-online {
            background-color: #238636;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .badge-offline {
            background-color: #6e7681;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Centre de Contrôle Bizi</h1>
    <p class="subtitle">Historique global et géolocalisation des visiteurs</p>

    <div class="stats-container">
        <div class="stat-box">
            <h3>EN LIGNE (TEMPS RÉEL)</h3>
            <div class="number" id="enLigneCount">0</div>
        </div>
        <div class="stat-box">
            <h3>TOTAL VISITEURS (30 JOURS)</h3>
            <div class="number" id="totalCount">0</div>
        </div>
    </div>

    <div class="table-container">
        <h2>Liste complète des Visiteurs</h2>
        <table>
            <thead>
                <tr>
                    <th>Statut</th>
                    <th>Adresse IP</th>
                    <th>Pays</th>
                    <th>Appareil</th>
                    <th>Navigateur</th>
                    <th>Langue</th>
                    <th>Dernière Visite</th>
                </tr>
            </thead>
            <tbody id="visiteursTableBody">
                <!-- Les données seront injectées ici dynamiquement -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://midnightblue-manatee-329921.hostingersite.com/presence.php';

        async function chargerDonnees() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.status === 'success') {
                    // Mise à jour des compteurs
                    document.getElementById('enLigneCount').innerText = data.en_ligne;
                    document.getElementById('totalCount').innerText = data.total_30j;

                    const tbody = document.getElementById('visiteursTableBody');
                    tbody.innerHTML = '';

                    // Remplissage du tableau avec les colonnes distinctes
                    data.visiteurs.forEach(v => {
                        const tr = document.createElement('tr');
                        
                        const statutBadge = v.en_ligne 
                            ? '<span class="badge-online">EN LIGNE</span>' 
                            : '<span class="badge-offline">HORS LIGNE</span>';

                        tr.innerHTML = `
                            <td>${statutBadge}</td>
                            <td><code>${v.ip}</code></td>
                            <td>${v.pays}</td>
                            <td><strong>${v.appareil}</strong></td>
                            <td>${v.navigateur}</td>
                            <td>${v.langue}</td>
                            <td>${v.derniere_activite}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
            }
        }

        // Charger immédiatement au chargement de la page, puis toutes les 5 secondes
        chargerDonnees();
        setInterval(chargerDonnees, 5000);
    </script>
</body>
</html>
