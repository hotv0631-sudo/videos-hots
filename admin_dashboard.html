<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Contrôle Bizi</title>
    <style>
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2ea043;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-box {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .stat-box:hover {
            border-color: #2ea043;
            transform: translateY(-2px);
        }
        .stat-box.active-filter {
            border-color: #2ea043;
            background: rgba(46, 160, 67, 0.1);
        }
        .stat-box h3 {
            font-size: 0.8rem;
            color: #8b949e;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }
        .stat-box .number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2ea043;
        }
        .table-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            overflow-x: auto;
        }
        h2 {
            font-size: 0.95rem;
            color: #c9d1d9;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #30363d;
            font-size: 0.85rem;
        }
        th {
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }
        
        /* Point vert clignotant */
        .badge-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(35, 134, 54, 0.2);
            color: #4ade80;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid #238636;
        }
        .dot-pulse {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .badge-offline {
            background-color: #6e7681;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .filter-info {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: normal;
            text-transform: none;
        }
    </style>
</head>
<body>

    <h1>Centre de Contrôle Bizi</h1>
    <p class="subtitle">Historique global et géolocalisation des visiteurs</p>

    <!-- Boutons cliquables pour filtrer les vues -->
    <div class="stats-container">
        <div class="stat-box active-filter" id="box-online" onclick="filtrerVue('online')">
            <h3>🟢 EN LIGNE (TEMPS RÉEL)</h3>
            <div class="number" id="enLigneCount">0</div>
        </div>
        <div class="stat-box" id="box-all" onclick="filtrerVue('all')">
            <h3>👥 TOTAL VISITEURS (30 JOURS)</h3>
            <div class="number" id="totalCount">0</div>
        </div>
    </div>

    <div class="table-container">
        <h2>
            <span id="table-title">Visiteurs en Ligne en Temps Réel</span>
            <span class="filter-info" id="filter-indicator">Affichage : En ligne uniquement</span>
        </h2>
        <table>
            <thead>
                <tr>
                    <th>Statut</th>
                    <th>Adresse IP</th>
                    <th>Pays</th>
                    <th>Appareil</th>
                    <th>Navigateur</th>
                    <th>Langue</th>
                    <th>Temps Passé</th>
                    <th>Dernière Visite</th>
                </tr>
            </thead>
            <tbody id="visiteursTableBody">
                <!-- Injection dynamique -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://midnightblue-manatee-329921.hostingersite.com/presence.php';
        let donneesGlobales = [];
        let filtreActif = 'online';

        function filtrerVue(type) {
            filtreActif = type;
            document.getElementById('box-online').classList.remove('active-filter');
            document.getElementById('box-all').classList.remove('active-filter');

            if (type === 'online') {
                document.getElementById('box-online').classList.add('active-filter');
                document.getElementById('table-title').innerText = "Visiteurs en Ligne en Temps Réel";
                document.getElementById('filter-indicator').innerText = "Affichage : En ligne uniquement";
            } else {
                document.getElementById('box-all').classList.add('active-filter');
                document.getElementById('table-title').innerText = "Historique Total (30 Jours)";
                document.getElementById('filter-indicator').innerText = "Affichage : Tous les visiteurs";
            }
            afficherTableau();
        }

        async function chargerDonnees() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('enLigneCount').innerText = data.en_ligne;
                    document.getElementById('totalCount').innerText = data.total_30j;
                    donneesGlobales = data.visiteurs;
                    afficherTableau();
                }
            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
            }
        }

        function afficherTableau() {
            const tbody = document.getElementById('visiteursTableBody');
            tbody.innerHTML = '';

            let listeFiltree = donneesGlobales;
            if (filtreActif === 'online') {
                listeFiltree = donneesGlobales.filter(v => v.en_ligne);
            }

            if (listeFiltree.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#8b949e; padding: 20px;">Aucun visiteur dans cette catégorie pour le moment.</td></tr>`;
                return;
            }

            listeFiltree.forEach(v => {
                const tr = document.createElement('tr');
                
                const statutBadge = v.en_ligne 
                    ? `<span class="badge-online"><span class="dot-pulse"></span> EN LIGNE</span>` 
                    : `<span class="badge-offline">HORS LIGNE</span>`;

                tr.innerHTML = `
                    <td>${statutBadge}</td>
                    <td><code>${v.ip}</code></td>
                    <td>${v.pays}</td>
                    <td><strong>${v.appareil}</strong></td>
                    <td>${v.navigateur}</td>
                    <td>${v.langue}</td>
                    <td><strong style="color: ${v.en_ligne ? '#4ade80' : '#cbd5e1'}">${v.temps_passe}</strong></td>
                    <td>${v.derniere_activite}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        chargerDonnees();
        setInterval(chargerDonnees, 5000);
    </script>
</body>
</html>
