            { nom: "Tape fort dedans", preview: "Movie0053.mp4", mega: "https://mega.nz/file/atBHFIaD#FmAm3Kcy0_o_yhHm4rB6k8Ic9sNq2MnFHqGDOQ72T-k", prix: 1100, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Slip violet sur le côté", preview: "Movie0054.mp4", mega: "https://mega.nz/file/DsommTgR#dZTHSN6p3J9BOXcWIbzFc_mod69j8GF12itdx7o-Dv0", prix: 1400, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "TS baise", preview: "Movie0055.mp4", mega: "https://mega.nz/file/m0I1nT4a#REBNaJbyheiId6VY2fLXtRlxL91qlx0idWv1obiDEro", prix: 1600, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "TS jouit 😋😋", preview: "Movie0056.mp4", mega: "https://mega.nz/file/mowgnbYJ#AAABAAAAAABYVxHxeWQelQAAAAAAAAAATFcR8Xlks1I", prix: 1700, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Bizi Disponible", preview: "Movie0057.mp4", mega: "https://mega.nz/file/ikRTWDaB#DgAAAP8ALwBi987PiK9vVwAAAAAAAAAAY_cyzvqvb1c", prix: 1900, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Sextap ✨✨", preview: "Movie0059.mp4", mega: "https://mega.nz/file/KwhBiYbZ#Y2NlcHQtRW7QnA0TB3ggAQAAAAAAAAAAs_NpemkfGiE", prix: 1200, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Il baise l'étudiante à l'école et éjacule dedans sans capote", preview: "Movie0060.mp4", mega: "https://mega.nz/file/u5AXiBLb#dcLqFZyqlKM0Nbtce4Zz48xTaZMWCvPpC2LKqiedKnQ", prix: 1500, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Influenceuse", preview: "Movie0061.mp4", mega: "https://mega.nz/file/jxIBjbgL#YTaWk8tO5uWARRYoexIsMRaTIdX6OXLMcOR6wWq8Vso", prix: 1000, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Il tape dans l'utérus de l'écolière sans capote", preview: "Movie0062.mp4", mega: "https://mega.nz/file/btAwUDYR#Y2NlcHQtRW7A2JqUPGhbhAAAAAAAAAAAo7f-_VIPYaQ", prix: 1300, wa: defaultWhatsApp, formula: "id * 2026 / 360" },
            { nom: "Elle baise en bleu blanc", preview: "Movie0063.mp4", mega: "https://mega.nz/file/GtwwiTrB#eL6H2G8AAACASUuSaeeSBQAAAAAAAAAA6Om3kxvnkgU", prix: 1800, wa: defaultWhatsApp, formula: "id * 2026 / 360" }
        ];

        const grid = document.getElementById("video-grid");
        let scenesData = JSON.parse(localStorage.getItem("vip_scenes_data_v37")) || [];

        function saveState() {
            localStorage.setItem("vip_scenes_data_v37", JSON.stringify(scenesData));
        }

        // Initialisation si vide
        if (scenesData.length === 0) {
            scenesData = baseScenes.map((item) => {
                const randomId = Math.floor(Math.random() * (90000 - 10000 + 1)) + 10000;
                return {
                    id: randomId,
                    nom: item.nom,
                    mega: item.mega,
                    preview: item.preview,
                    prix: item.prix,
                    wa: item.wa,
                    formula: item.formula,
                    deverrouille: false
                };
            });
            saveState();
        }

        function renderGrid() {
            grid.innerHTML = "";
            scenesData.forEach((scene, index) => {
                // Évaluation sécurisée de la formule personnalisée (ex: id * 2026 / 360)
                let cleAttendue;
                try {
                    let evaluatedFormula = scene.formula.replace(/id/g, scene.id);
                    cleAttendue = Math.floor(eval(evaluatedFormula));
                } catch(e) {
                    cleAttendue = Math.floor((scene.id * 2026) / 360);
                }

                const card = document.createElement("div");
                card.className = "card";
                card.id = `card-${index}`;

                const mediaHtml = `
                    <div class="media-container">
                        <video class="preview-video" controls autoplay muted loop playsinline preload="metadata" controlsList="nodownload">
                            <source src="${scene.preview}" type="video/mp4">
                            Votre navigateur ne supporte pas la lecture vidéo.
                        </video>
                    </div>
                `;

                if (scene.deverrouille) {
                    card.innerHTML = `
                        ${mediaHtml}
                        <h3>${scene.nom}</h3>
                        <div class="price-badge">💎 ${scene.prix} Fr</div>
                        <div class="info-id">ID : <b>${scene.id}</b></div>
                        <div class="message" style="color: #ff6600;">
                            ✅ Déverrouillé<br>
                            <a class="mega-link" href="${scene.mega}" target="_blank">📥 Regarder sur MEGA</a>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        ${mediaHtml}
                        <h3>${scene.nom}</h3>
                        <div class="price-badge">💎 ${scene.prix} Fr</div>
                        <div class="info-id">ID : <b>${scene.id}</b></div>
                        <a class="whatsapp-btn" href="https://wa.me/${scene.wa}?text=Bonjour,%20je%20veux%20acheter%20la%20clé%20pour%20la%20scène:%20${encodeURIComponent(scene.nom)}%20(ID:%20${scene.id})%20au%20prix%20de%20${scene.prix}Fr" target="_blank">
                            💬 Commander (${scene.prix} Fr)
                        </a>
                        <div class="input-group">
                            <input type="number" id="input-${index}" placeholder="Code clé...">
                            <button class="verify-btn" onclick="verifier(${index}, ${cleAttendue})">Valider</button>
                        </div>
                        <div class="message" id="msg-${index}"></div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function verifier(index, cleAttendue) {
            const inputElem = document.getElementById(`input-${index}`);
            const msg = document.getElementById(`msg-${index}`);
            const saisie = parseInt(inputElem.value.trim(), 10);

            if (saisie === cleAttendue) {
                scenesData[index].deverrouille = true;
                saveState();
                renderGrid();
            } else {
                msg.style.color = "#ff6600";
                msg.innerText = "Clé incorrecte.";
            }
        }

        function ouvrirAdmin() {
            const mdp = prompt("Entrez le mot de passe administrateur :");
            if (mdp === "admin123") {
                document.getElementById("admin-modal").style.display = "flex";
            } else if (mdp !== null) {
                alert("Mot de passe incorrect.");
            }
        }

        function fermerAdmin() {
            document.getElementById("admin-modal").style.display = "none";
        }

        function ajouterScene() {
            const nom = document.getElementById("new-nom").value.trim();
            const preview = document.getElementById("new-preview").value.trim();
            const mega = document.getElementById("new-mega").value.trim();
            const prix = parseInt(document.getElementById("new-prix").value.trim(), 10);
            const wa = document.getElementById("new-whatsapp").value.trim() || defaultWhatsApp;
            const formula = document.getElementById("new-formula").value.trim() || "id * 2026 / 360";

            if (!nom || !preview || !mega || isNaN(prix)) {
                alert("Veuillez remplir tous les champs obligatoires correctement !");
                return;
            }

            const randomId = Math.floor(Math.random() * (90000 - 10000 + 1)) + 10000;

            const nouvelleScene = {
                id: randomId,
                nom: nom,
                preview: preview,
                mega: mega,
                prix: prix,
                wa: wa,
                formula: formula,
                deverrouille: false
            };

            scenesData.push(nouvelleScene);
            saveState();
            renderGrid();
            fermerAdmin();

            // Vider le formulaire
            document.getElementById("new-nom").value = "";
            document.getElementById("new-preview").value = "";
            document.getElementById("new-mega").value = "";
            document.getElementById("new-prix").value = "";
            alert("Scène ajoutée avec succès !");
        }

        // Lancer l'affichage initial
        renderGrid();
    </script>

</body>
