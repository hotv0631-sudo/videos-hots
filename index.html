<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private VIP - Exclusivités</title>
    <style>
        body {
            background-color: #0b0610;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid #ff2a85;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff2a85;
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 11px;
            color: #d8b4fe;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #1a0b2e;
            border: 1px solid #a855f7;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
            overflow: hidden;
        }
        .preview-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #ff2a85;
            font-size: 16px;
            text-align: center;
        }
        .info-id {
            font-size: 12px;
            color: #e9d5ff;
            margin-bottom: 8px;
            text-align: center;
        }
        .whatsapp-btn {
            display: block;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            background: #0b0610;
            border: 1px solid #ff2a85;
            border-radius: 6px;
            padding: 8px;
            color: white;
            font-size: 13px;
        }
        button.verify-btn {
            background: #ff2a85;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .message {
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }
        .mega-link {
            display: inline-block;
            background: #ff2a85;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PRIVATE VIP</h1>
        <div class="subtitle">Scènes exclusives • Défilement infini • Commande WhatsApp</div>
    </header>

    <div class="grid" id="video-grid"></div>

    <script>
        // Liste de vos 3 scènes avec vos vrais liens MEGA
        const scenes = [
            { 
                id: 49216, 
                nom: "Scene_Hot_X79", 
                apercu: "https://mega.nz/file/61Zh2QwY#BCqsGy36QmkqhR6KL8rhU_HPY3Mt2doV6vMe1ioQkLY", 
                mega: "https://mega.nz/file/61Zh2QwY#BCqsGy36QmkqhR6KL8rhU_HPY3Mt2doV6vMe1ioQkLY" 
            },
            { 
                id: 62541, 
                nom: "Private_Z99", 
                apercu: "https://mega.nz/file/b0AHSBZb#AeLR3rKCOOF4m54VHvfdNkvUzq0DjtZkiyqspQNo3g4", 
                mega: "https://mega.nz/file/b0AHSBZb#AeLR3rKCOOF4m54VHvfdNkvUzq0DjtZkiyqspQNo3g4" 
            },
            { 
                id: 63555, 
                nom: "Exclusive_008", 
                apercu: "https://mega.nz/file/Hx5kBbKD#OQKM2Kk5S0D6bhGcT4_52qJdjnRAzZ7t4bM8UAtpWQk", 
                mega: "https://mega.nz/file/Hx5kBbKD#OQKM2Kk5S0D6bhGcT4_52qJdjnRAzZ7t4bM8UAtpWQk" 
            }
        ];

        const grid = document.getElementById("video-grid");
        const whatsappNumber = "2250105553740";

        scenes.forEach(scene => {
            // Calcul de la clé (arrondi entier pour simplifier la saisie)
            const cleAttendue = Math.round((scene.id * 2026) / 360);

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${scene.nom}</h3>
                <div class="info-id">ID unique : <b>${scene.id}</b></div>
                <a class="whatsapp-btn" href="https://wa.me/${whatsappNumber}?text=Bonjour,%20je%20veux%20acheter%20la%20scène%20ID:%20${scene.id}" target="_blank">
                    💬 Commander la clé sur WhatsApp
                </a>
                <div class="input-group">
                    <input type="number" id="input-${scene.id}" placeholder="Entrez la clé...">
                    <button class="verify-btn" onclick="verifier(${scene.id}, ${cleAttendue}, '${scene.mega}')">Valider</button>
                </div>
                <div class="message" id="msg-${scene.id}"></div>
            `;
            grid.appendChild(card);
        });

        function verifier(id, cleAttendue, lienMega) {
            const saisieVal = document.getElementById(`input-${id}`).value.trim();
            const msg = document.getElementById(`msg-${id}`);
            const saisie = parseInt(saisieVal, 10);

            if (saisie === cleAttendue) {
                msg.style.color = "#ff2a85";
                msg.innerHTML = `Clé valide !<br><a class="mega-link" href="${lienMega}" target="_blank">📥 Accéder à la vidéo MEGA</a>`;
            } else {
                msg.style.color = "#a855f7";
                msg.innerText = "Clé incorrecte. Réessayez.";
            }
        }
    </script>

</body>
</html>
