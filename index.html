<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private VIP - Exclusivités</title>
    <style>
        body {
            background-color: #0b0610;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid #ff2a85;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff2a85;
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 11px;
            color: #d8b4fe;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #1a0b2e;
            border: 1px solid #a855f7;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #ff2a85;
            font-size: 16px;
            text-align: center;
        }
        .info-id {
            font-size: 12px;
            color: #e9d5ff;
            margin-bottom: 8px;
            text-align: center;
        }
        .whatsapp-btn {
            display: block;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            background: #0b0610;
            border: 1px solid #ff2a85;
            border-radius: 6px;
            padding: 8px;
            color: white;
            font-size: 13px;
        }
        button.verify-btn {
            background: #ff2a85;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .message {
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }
        .mega-link {
            display: inline-block;
            background: #ff2a85;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PRIVATE VIP</h1>
        <div class="subtitle">Scènes exclusives • Accès Sécurisé • Commande WhatsApp</div>
    </header>

    <div class="grid" id="video-grid"></div>

    <script>
        const whatsappNumber = "2250105553740";

        // Vos 3 vidéos et liens MEGA
        const sourceScenes = [
            { nom: "Scene_Hot_X79", mega: "https://mega.nz/file/61Zh2QwY#BCqsGy36QmkqhR6KL8rhU_HPY3Mt2doV6vMe1ioQkLY" },
            { nom: "Private_Z99", mega: "https://mega.nz/file/b0AHSBZb#AeLR3rKCOOF4m54VHvfdNkvUzq0DjtZkiyqspQNo3g4" },
            { nom: "Exclusive_008", mega: "https://mega.nz/file/Hx5kBbKD#OQKM2Kk5S0D6bhGcT4_52qJdjnRAzZ7t4bM8UAtpWQk" }
        ];

        const grid = document.getElementById("video-grid");

        // ID aléatoire par navigateur/client
        let scenesData = JSON.parse(localStorage.getItem("vip_scenes_data"));

        if (!scenesData) {
            scenesData = sourceScenes.map(scene => {
                const randomId = Math.floor(Math.random() * (90000 - 10000 + 1)) + 10000;
                return {
                    id: randomId,
                    nom: scene.nom,
                    mega: scene.mega,
                    deverrouille: false
                };
            });
            localStorage.setItem("vip_scenes_data", JSON.stringify(scenesData));
        }

        scenesData.forEach((scene, index) => {
            // Formule : ID * 2026 / 360 pris strictement sans virgule (Math.floor)
            const cleAttendue = Math.floor((scene.id * 2026) / 360);

            const card = document.createElement("div");
            card.className = "card";
            card.id = `card-${index}`;

            if (scene.deverrouille) {
                card.innerHTML = `
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <div class="message" style="color: #ff2a85;">
                        ✅ Scène déverrouillée<br>
                        <a class="mega-link" href="${scene.mega}" target="_blank">📥 Voir la vidéo sur MEGA</a>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <a class="whatsapp-btn" href="https://wa.me/${whatsappNumber}?text=Bonjour,%20je%20souhaite%20acheter%20la%20clé%20pour%20la%20scène%20ID:%20${scene.id}" target="_blank">
                        💬 Commander la clé sur WhatsApp
                    </a>
                    <div class="input-group">
                        <input type="number" id="input-${index}" placeholder="Entrez la clé sans virgule...">
                        <button class="verify-btn" onclick="verifier(${index}, ${cleAttendue})">Valider</button>
                    </div>
                    <div class="message" id="msg-${index}"></div>
                `;
            }
            grid.appendChild(card);
        });

        function verifier(index, cleAttendue) {
            const saisieVal = document.getElementById(`input-${index}`).value.trim();
            const msg = document.getElementById(`msg-${index}`);
            const saisie = parseInt(saisieVal, 10);

            if (saisie === cleAttendue) {
                // Marquer comme déverrouillé définitivement
                scenesData[index].deverrouille = true;
                localStorage.setItem("vip_scenes_data", JSON.stringify(scenesData));

                const card = document.getElementById(`card-${index}`);
                card.innerHTML = `
                    <h3>${scenesData[index].nom}</h3>
                    <div class="info-id">ID unique : <b>${scenesData[index].id}</b></div>
                    <div class="message" style="color: #ff2a85;">
                        🎉 Clé valide !<br>
                        <a class="mega-link" href="${scenesData[index].mega}" target="_blank">📥 Voir la vidéo sur MEGA</a>
                    </div>
                `;
            } else {
                msg.style.color = "#a855f7";
                msg.innerText = "Clé incorrecte. Réessayez.";
            }
        }
    </script>

</body>
</html>
