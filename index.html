<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private VIP - Exclusivités</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0610;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid #ff2a85;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff2a85;
            font-size: 24px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 11px;
            color: #d8b4fe;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        .card {
            background: #1a0b2e;
            border: 1px solid #a855f7;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.25);
            overflow: hidden;
        }
        .media-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 12px;
            border: 1px solid #ff2a85;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video.preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card h3 {
            margin: 0 0 6px 0;
            color: #ff2a85;
            font-size: 17px;
            text-align: center;
        }
        .info-id {
            font-size: 12px;
            color: #e9d5ff;
            margin-bottom: 12px;
            text-align: center;
            background: rgba(255, 42, 133, 0.1);
            padding: 4px;
            border-radius: 6px;
        }
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .whatsapp-btn:active {
            opacity: 0.8;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            background: #0b0610;
            border: 1px solid #ff2a85;
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input::placeholder {
            color: #a855f7;
        }
        button.verify-btn {
            background: #ff2a85;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .message {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
        .mega-link {
            display: block;
            background: #ff2a85;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>PRIVATE VIP</h1>
        <div class="subtitle">Aperçus Vidéo HD • Clé Sécurisée • WhatsApp Direct</div>
    </header>

    <div class="grid" id="video-grid"></div>

    <script>
        const whatsappNumber = "2250105553740";

        // Configuration des scènes avec lien MEGA et lien vidéo d'aperçu direct
        const sourceScenes = [
            { 
                nom: "Scene_Hot_X79", 
                mega: "https://mega.nz/file/61Zh2QwY#BCqsGy36QmkqhR6KL8rhU_HPY3Mt2doV6vMe1ioQkLY",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
            },
            { 
                nom: "Private_Z99", 
                mega: "https://mega.nz/file/b0AHSBZb#AeLR3rKCOOF4m54VHvfdNkvUzq0DjtZkiyqspQNo3g4",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
            },
            { 
                nom: "Exclusive_008", 
                mega: "https://mega.nz/file/Hx5kBbKD#OQKM2Kk5S0D6bhGcT4_52qJdjnRAzZ7t4bM8UAtpWQk",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
            }
        ];

        const grid = document.getElementById("video-grid");

        // Gestion des ID aléatoires par appareil
        let scenesData = JSON.parse(localStorage.getItem("vip_scenes_data_v2"));

        if (!scenesData) {
            scenesData = sourceScenes.map(scene => {
                const randomId = Math.floor(Math.random() * (90000 - 10000 + 1)) + 10000;
                return {
                    id: randomId,
                    nom: scene.nom,
                    mega: scene.mega,
                    preview: scene.preview,
                    deverrouille: false
                };
            });
            localStorage.setItem("vip_scenes_data_v2", JSON.stringify(scenesData));
        }

        scenesData.forEach((scene, index) => {
            // Formule : ID * 2026 / 360 sans aucune virgule (Math.floor)
            const cleAttendue = Math.floor((scene.id * 2026) / 360);

            const card = document.createElement("div");
            card.className = "card";
            card.id = `card-${index}`;

            const mediaHtml = `
                <div class="media-container">
                    <video class="preview-video" controls playsinline preload="metadata">
                        <source src="${scene.preview}" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture vidéo.
                    </video>
                </div>
            `;

            if (scene.deverrouille) {
                card.innerHTML = `
                    ${mediaHtml}
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <div class="message" style="color: #ff2a85;">
                        ✅ Scène Déverrouillée<br>
                        <a class="mega-link" href="${scene.mega}" target="_blank">📥 Regarder sur MEGA</a>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    ${mediaHtml}
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <a class="whatsapp-btn" href="https://wa.me/${whatsappNumber}?text=Bonjour,%20je%20souhaite%20acheter%20la%20clé%20pour%20la%20scène%20ID:%20${scene.id}" target="_blank">
                        💬 Commander la clé sur WhatsApp
                    </a>
                    <div class="input-group">
                        <input type="number" id="input-${index}" placeholder="Entrez la clé sans virgule...">
                        <button class="verify-btn" onclick="verifier(${index}, ${cleAttendue})">Valider</button>
                    </div>
                    <div class="message" id="msg-${index}"></div>
                `;
            }
            grid.appendChild(card);
        });

        function verifier(index, cleAttendue) {
            const saisieVal = document.getElementById(`input-${index}`).value.trim();
            const msg = document.getElementById(`msg-${index}`);
            const saisie = parseInt(saisieVal, 10);

            if (saisie === cleAttendue) {
                scenesData[index].deverrouille = true;
                localStorage.setItem("vip_scenes_data_v2", JSON.stringify(scenesData));

                const card = document.getElementById(`card-${index}`);
                card.innerHTML = `
                    <div class="media-container">
                        <video class="preview-video" controls playsinline preload="metadata">
                            <source src="${scenesData[index].preview}" type="video/mp4">
                        </video>
                    </div>
                    <h3>${scenesData[index].nom}</h3>
                    <div class="info-id">ID unique : <b>${scenesData[index].id}</b></div>
                    <div class="message" style="color: #ff2a85;">
                        🎉 Clé Valide !<br>
                        <a class="mega-link" href="${scenesData[index].mega}" target="_blank">📥 Regarder la vidéo sur MEGA</a>
                    </div>
                `;
            } else {
                msg.style.color = "#a855f7";
                msg.innerText = "Clé incorrecte. Vérifiez et réessayez.";
            }
        }
    </script>

</body>
</html>
