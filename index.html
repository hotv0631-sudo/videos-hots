<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOUVEAU DOSSIER 📂 DE BABY</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #d1d5db !important; /* Fond gris de la page */
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 3px solid #ff6600;
            margin-bottom: 20px;
            background: #e5e7eb; /* Fond gris pour l'en-tête */
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6600;
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .folder-icon {
            color: #eab308;
        }
        .subtitle {
            font-size: 12px;
            color: #ff6600;
            font-weight: bold;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        .card {
            background: #e5e7eb; /* Fond gris à l'intérieur des conteneurs / cartes */
            border: 2px solid #ff6600;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.15);
            overflow: hidden;
        }
        .media-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000000;
            margin-bottom: 12px;
            border: 1px solid #ff6600;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video.preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #ff6600;
            font-size: 18px;
            text-align: center;
        }
        .info-id {
            font-size: 13px;
            color: #ff6600;
            margin-bottom: 12px;
            text-align: center;
            background: #f3f4f6;
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed #ff6600;
        }
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-btn:active {
            opacity: 0.85;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            background: #f9fafb;
            border: 2px solid #ff6600;
            border-radius: 8px;
            padding: 10px;
            color: #333333;
            font-size: 14px;
            outline: none;
        }
        input::placeholder {
            color: #9ca3af;
        }
        button.verify-btn {
            background: #25d366;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3);
        }
        .message {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
        .mega-link {
            display: block;
            background: #25d366;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>NOUVEAU DOSSIER <span class="folder-icon">📂</span> DE BABY</h1>
        <div class="subtitle">Aperçus Vidéo HD • Clé Sécurisée • WhatsApp Direct</div>
    </header>

    <div class="grid" id="video-grid"></div>

    <script>
        const whatsappNumber = "2250105553740";

        const sourceScenes = [
            { 
                nom: "Scene_Hot_X79", 
                mega: "https://mega.nz/file/61Zh2QwY#BCqsGy36QmkqhR6KL8rhU_HPY3Mt2doV6vMe1ioQkLY",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
            },
            { 
                nom: "Private_Z99", 
                mega: "https://mega.nz/file/b0AHSBZb#AeLR3rKCOOF4m54VHvfdNkvUzq0DjtZkiyqspQNo3g4",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
            },
            { 
                nom: "Exclusive_008", 
                mega: "https://mega.nz/file/Hx5kBbKD#OQKM2Kk5S0D6bhGcT4_52qJdjnRAzZ7t4bM8UAtpWQk",
                preview: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
            }
        ];

        const grid = document.getElementById("video-grid");

        let scenesData = JSON.parse(localStorage.getItem("vip_scenes_data_v7"));

        if (!scenesData) {
            scenesData = sourceScenes.map(scene => {
                const randomId = Math.floor(Math.random() * (90000 - 10000 + 1)) + 10000;
                return {
                    id: randomId,
                    nom: scene.nom,
                    mega: scene.mega,
                    preview: scene.preview,
                    deverrouille: false
                };
            });
            localStorage.setItem("vip_scenes_data_v7", JSON.stringify(scenesData));
        }

        scenesData.forEach((scene, index) => {
            const cleAttendue = Math.floor((scene.id * 2026) / 360);

            const card = document.createElement("div");
            card.className = "card";
            card.id = `card-${index}`;

            const mediaHtml = `
                <div class="media-container">
                    <video class="preview-video" controls playsinline preload="metadata">
                        <source src="${scene.preview}" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture vidéo.
                    </video>
                </div>
            `;

            if (scene.deverrouille) {
                card.innerHTML = `
                    ${mediaHtml}
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <div class="message" style="color: #ff6600;">
                        ✅ Scène Déverrouillée<br>
                        <a class="mega-link" href="${scene.mega}" target="_blank">📥 Regarder sur MEGA</a>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    ${mediaHtml}
                    <h3>${scene.nom}</h3>
                    <div class="info-id">ID unique : <b>${scene.id}</b></div>
                    <a class="whatsapp-btn" href="https://wa.me/${whatsappNumber}?text=Bonjour,%20je%20souhaite%20acheter%20la%20clé%20pour%20la%20scène%20ID:%20${scene.id}" target="_blank">
                        💬 Commander la clé sur WhatsApp
                    </a>
                    <div class="input-group">
                        <input type="number" id="input-${index}" placeholder="Entrez la clé sans virgule...">
                        <button class="verify-btn" onclick="verifier(${index}, ${cleAttendue})">Valider</button>
                    </div>
                    <div class="message" id="msg-${index}"></div>
                `;
            }
            grid.appendChild(card);
        });

        function verifier(index, cleAttendue) {
            const saisieVal = document.getElementById(`input-${index}`).value.trim();
            const msg = document.getElementById(`msg-${index}`);
            const saisie = parseInt(saisieVal, 10);

            if (saisie === cleAttendue) {
                scenesData[index].deverrouille = true;
                localStorage.setItem("vip_scenes_data_v7", JSON.stringify(scenesData));

                const card = document.getElementById(`card-${index}`);
                card.innerHTML = `
                    <div class="media-container">
                        <video class="preview-video" controls playsinline preload="metadata">
                            <source src="${scenesData[index].preview}" type="video/mp4">
                        </video>
                    </div>
                    <h3>${scenesData[index].nom}</h3>
                    <div class="info-id">ID unique : <b>${scenesData[index].id}</b></div>
                    <div class="message" style="color: #ff6600;">
                        🎉 Clé Valide !<br>
                        <a class="mega-link" href="${scenesData[index].mega}" target="_blank">📥 Regarder la vidéo sur MEGA</a>
                    </div>
                `;
            } else {
                msg.style.color = "#ff6600";
                msg.innerText = "Clé incorrecte. Vérifiez et réessayez.";
            }
        }
    </script>

</body>
</html>
